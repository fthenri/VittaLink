    <circle cx="38" cy="24" r="1.5" fill="#059669"/>
  </g>
  
  <!-- Text "VittaLink" -->
  <text x="54" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#059669">VittaLink</text>
