<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="60" fill="white"/>
  
  <!-- Logo (simplified) -->
  <g transform="translate(8, 6)">
    <!-- Outer circle segments -->
    <circle cx="22" cy="22" r="18" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="28.3 28.3" stroke-dashoffset="14.15"/>
    
    <!-- Inner design elements -->
    <circle cx="22" cy="10" r="3" fill="#059669"/>
    <path d="M 10 18 Q 15 12 20 15" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 34 18 Q 29 12 24 15" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Heartbeat line -->
    <path d="M 6 24 L 16 24 L 18 20 L 20 24 L 22 24 L 24 28 L 26 24 L 34 24" 
          stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
